services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    container_name: flow_db
    environment:
      MYSQL_DATABASE: ${DB_NAME:-flow}
      MYSQL_USER: ${DB_USER:-flow}
      MYSQL_PASSWORD: ${DB_PASSWORD:-flow}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_ROOT_PASSWORD:-root}" ]
      interval: 5s
      timeout: 5s
      retries: 10

  phpmyadmin:
    image: phpmyadmin:latest
    restart: unless-stopped
    container_name: flow_phpmyadmin
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      UPLOAD_LIMIT: 256M
    ports:
      - "8080:80"
    depends_on:
      db:
        condition: service_healthy

  django:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: flow_django
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 3306
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data:
